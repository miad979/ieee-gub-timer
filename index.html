<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IEEE GUB SB Countdown Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;600&family=Outfit:wght@400;500;600&display=swap">
<style>
:root{--bg:#050f14;--bg2:#0a2230;--ink:#eef6f2;--mute:#8fa9a6;--green:#7fc243;--blue:#2a9be0;--amber:#ffb23e;--red:#ff5a4d;--ring:var(--green);--r:min(72vw,40vh,420px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{min-height:100%}
body{background:radial-gradient(1200px 700px at 50% 38%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:Outfit,system-ui,sans-serif;display:flex;flex-direction:column;min-height:100dvh;overflow-x:hidden}
body.warn{--ring:var(--amber)}body.crit{--ring:var(--red)}
.page{flex:1;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(12px,2.4vw,28px);gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plate{flex-shrink:0;background:#fff;border-radius:16px;padding:8px 16px;display:flex;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.6) inset}
.plate img{display:block;width:auto;max-width:100%}
.top .plate img{height:clamp(34px,6.2vw,62px)}
.bottom{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding-top:8px;gap:clamp(10px,2vw,22px)}
.bottom .plate img{height:clamp(34px,5.6vw,58px)}
.bottom .plate.sq img{height:clamp(46px,7.4vw,76px)}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,20px);padding:8px 0}
.title{background:none;border:0;border-bottom:1px dashed #ffffff30;color:var(--ink);font:500 clamp(16px,2.4vw,24px)/1.3 Outfit,sans-serif;text-align:center;width:min(90vw,520px);padding:4px;outline:none}
.title:focus{border-bottom-color:var(--green)}
.dial{position:relative;width:var(--r);height:var(--r)}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.trk{fill:none;stroke:#ffffff14;stroke-width:9}
.bar{fill:none;stroke:var(--ring);stroke-width:9;stroke-linecap:round;transition:stroke .6s;filter:drop-shadow(0 0 10px var(--ring))}
.read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font:200 calc(var(--r)*.25)/1 Sora,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 40px color-mix(in srgb,var(--ring) 45%,transparent)}
body.crit .time{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.state{margin-top:calc(var(--r)*.03);color:var(--mute);font-size:clamp(12px,1.8vw,16px)}
.marks{display:flex;gap:8px}
.chip{padding:5px 14px;border-radius:99px;border:1px solid #ffffff22;color:var(--mute);font-size:13px;transition:.4s}
.chip.done{background:var(--green);color:#06210a;border-color:var(--green);font-weight:600}
.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
button{font:500 15px Outfit,sans-serif;color:var(--ink);background:#ffffff0f;border:1px solid #ffffff22;border-radius:12px;padding:10px 18px;cursor:pointer;transition:.2s}
button:hover{background:#ffffff1c}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.go{background:linear-gradient(135deg,#8fd44d,#4aa83a);color:#06210a;border:0;font-weight:600;min-width:120px;padding:12px 28px;box-shadow:0 8px 26px #7fc24340}
button.go:hover{filter:brightness(1.08)}
.set{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.set button{padding:7px 13px;font-size:14px}
.set button.on{border-color:var(--green);color:var(--green)}
.set input{width:84px;background:#ffffff0f;border:1px solid #ffffff22;border-radius:12px;color:var(--ink);font:500 15px Outfit,sans-serif;padding:8px 10px;text-align:center}
.set label{color:var(--mute);font-size:14px}
/* finish */
#end{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle at 50% 45%,#0e3a2aee,#04120dfa 70%);padding:20px}
#end.show{display:flex;animation:fade .8s}
@keyframes fade{from{opacity:0}}
#end canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rays{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(from 0deg,#7fc2431c 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite;mask:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.up{position:relative;font:300 clamp(18px,3vw,30px) Sora,sans-serif;color:var(--amber);letter-spacing:.3em;animation:rise .9s .1s both}
.luck{position:relative;font:600 clamp(48px,13vw,150px)/1.02 Sora,sans-serif;background:linear-gradient(100deg,#fff 20%,#b9f26f 40%,#ffd36b 55%,#fff 75%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1s .5s both,shine 3.5s 1.5s linear infinite;margin:.1em 0}
.sub{position:relative;font-size:clamp(15px,2.2vw,22px);color:#cfe8d6;max-width:640px;animation:rise 1s 1.1s both}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes shine{to{background-position:-250% 0}}
.logos{position:relative;display:flex;gap:12px;margin-top:26px;animation:rise 1s 1.5s both}
.logos .plate img{height:clamp(30px,5vw,48px)}
#end button{position:relative;margin-top:26px;animation:rise 1s 1.9s both}
.bottom{position:relative}.credit{position:absolute;right:0;bottom:0;text-align:right;font-size:12px;line-height:1.45;color:var(--mute)}.credit b{display:block;color:var(--ink);font-weight:500;font-size:13px}
@media (max-width:1000px){.credit{position:static;width:100%;text-align:center}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),C=2*Math.PI*136;
let total=900,rem=900000,endAt=0,run=false,tick=null,muted=false,fired={},ctx=null;
const bar=$('#bar'),time=$('#time'),st=$('#state'),go=$('#go');

function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (h?h+':':'')+p(m)+':'+p(x)}
function paint(){
  const s=Math.max(0,Math.ceil(rem/1000));
  time.textContent=fmt(s);document.title=(run?fmt(s)+' · ':'')+'IEEE GUB SB Timer';
  bar.style.strokeDashoffset=C*(1-rem/(total*1000));
  document.body.classList.toggle('warn',s<=300&&s>60);document.body.classList.toggle('crit',s<=60&&(run||s>0)&&s<total);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('done',!!fired[c.dataset.m]));
}
/* audio */
function audio(){if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)ctx=new A()}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function beeps(n,dur,gap,f,vol,after){
  if(muted||!audio())return 0;let t=ctx.currentTime+(after||0)+.05;
  for(let i=0;i<n;i++){
    [f,f*1.5].forEach((fr,k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=k?'sine':'square';o.frequency.value=fr;
      const v=(k?vol*.5:vol*.35);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+dur-.04);g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.02)});
    t+=dur+gap}
  return (after||0)+n*(dur+gap)}
function say(txt,delay){if(muted||!('speechSynthesis' in window))return;setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.92;u.volume=1;speechSynthesis.speak(u)}catch(e){}},delay*1000)}
const big=(n,a)=>beeps(n,.65,.25,880,.9,a),fast=(n,a)=>beeps(n,.1,.07,1320,.8,a);
function notify(m){
  fired[m]=1;
  if(m===900){const d=big(1);say('15 minutes remaining',d)}
  if(m===600){const d=big(1);say('10 minutes remaining',d)}
  if(m===300){const d=big(3);say('5 minutes remaining',d)}
}
function finish(){
  clearInterval(tick);run=false;rem=0;fired[0]=1;go.textContent='Start';st.textContent="Time's up";paint();
  const a=big(2),b=fast(5,a);say("Time's up. Best of luck!",b+.1);
  $('#end').classList.add('show');confetti(true);
}
function loop(){
  rem=Math.max(0,endAt-Date.now());const s=Math.ceil(rem/1000);
  [900,600,300].forEach(m=>{if(!fired[m]&&total>m&&s<=m)notify(m)});
  paint();if(rem<=0)finish()}
function start(){
  audio();
  if(rem<=0)reset();
  if(!run){
    if(rem===total*1000){[900,600,300].forEach(m=>{if(total<=m)fired[m]=1})}
    endAt=Date.now()+rem;run=true;go.textContent='Pause';st.textContent='Running';tick=setInterval(loop,100);loop()
  }else{clearInterval(tick);run=false;rem=Math.max(0,endAt-Date.now());go.textContent='Resume';st.textContent='Paused';paint()}
}
function reset(){clearInterval(tick);run=false;fired={};rem=total*1000;go.textContent='Start';st.textContent='Ready';try{speechSynthesis.cancel()}catch(e){}paint()}
function setMin(m){m=Math.min(180,Math.max(1,Math.round(m)));total=m*60;reset();document.querySelectorAll('#set button').forEach(b=>b.classList.toggle('on',+b.dataset.min===m))}
go.onclick=start;$('#rst').onclick=reset;
$('#set').onclick=e=>{if(e.target.dataset.min){setMin(+e.target.dataset.min);$('#cm').value=''}};
$('#cm').onchange=e=>{if(e.target.value)setMin(+e.target.value)};
$('#mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on';if(muted)try{speechSynthesis.cancel()}catch(x){}};
$('#test').onclick=()=>{const d=big(1);say('Sound check. Timer is ready.',d)};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
function closeEnd(){$('#end').classList.remove('show');confetti(false)}
$('#close').onclick=closeEnd;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();if($('#end').classList.contains('show'))closeEnd();else start()}
  if(e.key==='r'||e.key==='R')reset();if(e.key==='f'||e.key==='F')$('#fs').click();if(e.key==='Escape')closeEnd()});
/* confetti */
let ps=[],raf=0;
function confetti(on){
  const cv=$('#cv'),x=cv.getContext('2d');cancelAnimationFrame(raf);if(!on){x.clearRect(0,0,cv.width,cv.height);return}
  cv.width=innerWidth;cv.height=innerHeight;const col=['#7fc243','#2a9be0','#ffd36b','#ffffff','#b9f26f','#ff7a59'];ps=[];
  const burst=(cx,cy,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=6+Math.random()*12;ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*8,h:3+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[i%col.length],l:260+Math.random()*120})}};
  burst(cv.width*.2,cv.height*.7,110);burst(cv.width*.8,cv.height*.7,110);setTimeout(()=>burst(cv.width/2,cv.height*.4,160),600);
  let f=0;(function draw(){f++;x.clearRect(0,0,cv.width,cv.height);
    if(f%50===0&&f<1200)burst(Math.random()*cv.width,-10,35);
    ps.forEach(p=>{p.vy+=.22;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.min(1,p.l/60);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    ps=ps.filter(p=>p.l>0&&p.y<cv.height+40);raf=requestAnimationFrame(draw)})()}
setMin(15);
</script>
